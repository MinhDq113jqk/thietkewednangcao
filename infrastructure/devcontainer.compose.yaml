services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:5.1.2-24-bullseye
    volumes:
      - .:/workspaces/myproject:cached
    command: sleep infinity
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/souvenirshop
      NODE_ENV: development
